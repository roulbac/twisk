# Built-in form for managed jobs (sky jobs launch).
kind: job
title: Managed job
description: Batch run with automatic recovery from preemptions (sky jobs launch)
fields:
  - {key: name, label: Job name, required: true, placeholder: train-model}

  - {key: infra, label: Infra, section: Resources, path: resources.infra, suggest: infra,
     placeholder: auto (cheapest enabled), help: "k8s, aws, gcp/us-central1, k8s/my-context … empty = let SkyPilot choose"}
  - {key: accelerators, label: Accelerators, section: Resources, path: resources.accelerators, suggest: accelerators,
     placeholder: none, help: "GPU/TPU as NAME:COUNT, e.g. A100:1, H100:8"}
  - {key: cpus, label: vCPUs, section: Resources, path: resources.cpus, default: "1", placeholder: default,
     help: "number, or N+ for 'at least N'"}
  - {key: memory, label: Memory (GB), section: Resources, path: resources.memory, default: "2", placeholder: default,
     help: "number, or N+ for 'at least N'"}
  - {key: disk_size, label: Disk (GB), type: int, min: 1, section: Resources, path: resources.disk_size, placeholder: default}
  - {key: use_spot, label: Use spot/preemptible, type: bool, section: Resources, path: resources.use_spot}
  - {key: image_id, label: Image, section: Resources, path: resources.image_id, placeholder: SkyPilot default,
     help: "docker:<image> for containers, or a cloud image id"}
  - {key: ports, label: Ports, type: list, section: Resources, path: resources.ports, placeholder: none,
     help: "comma-separated, e.g. 8888, 6006"}

  - key: recovery_strategy
    label: Recovery strategy
    type: select
    section: Recovery
    path: resources.job_recovery.strategy
    default: ""
    options:
      - {label: Default (FAILOVER), value: ""}
      - {label: FAILOVER, value: FAILOVER}
      - {label: EAGER_NEXT_REGION, value: EAGER_NEXT_REGION}
  - {key: max_restarts_on_errors, label: Restarts on user errors, type: int, min: 0, max: 100, section: Recovery,
     path: resources.job_recovery.max_restarts_on_errors, placeholder: "0",
     help: "re-run the job this many times if it exits non-zero (preemptions are always recovered)"}
  - {key: pool, label: Run in pool, section: Recovery, path: twisk.pool, suggest: pools, placeholder: none (dedicated cluster),
     help: "submit to a pool's warm workers instead of provisioning (see :pools)"}

  - {key: num_nodes, label: Nodes, type: int, min: 1, section: Workload, path: num_nodes, placeholder: "1"}
  - {key: workdir, label: Workdir, section: Workload, path: workdir, placeholder: none,
     help: "local directory synced to ~/sky_workdir (absolute path or ~/…)"}
  - {key: setup, label: Setup commands, type: area, section: Workload, path: setup, help: runs once when nodes are provisioned}
  - {key: run, label: Run command, type: area, section: Workload, path: run, required: true,
     default: "echo \"hello from a managed job\"; sleep 30", help: the main command}

  - {key: envs, label: Environment, type: kv, section: Environment & storage, path: envs, help: "KEY=value, one per line; indent 2 spaces to continue a value"}
  - {key: volumes, label: Volume mounts, type: kv, section: Environment & storage, path: volumes, suggest: volumes,
     help: "/mount/path=volume-name, one per line (see :volumes)"}
template: |
  name: {{ name }}
  resources:
    infra: {{ infra | yaml }}
    accelerators: {{ accelerators | yaml }}
    cpus: {{ cpus | yaml }}
    memory: {{ memory | yaml }}
    disk_size: {{ disk_size | yaml }}
    use_spot: {{ use_spot | yaml }}
    image_id: {{ image_id | yaml }}
    ports: {{ ports | yaml }}
    job_recovery:
      strategy: {{ recovery_strategy | yaml }}
      max_restarts_on_errors: {{ max_restarts_on_errors | yaml }}
  num_nodes: {{ num_nodes | yaml }}
  workdir: {{ workdir | yaml }}
  envs: {{ envs | yaml }}
  volumes: {{ volumes | yaml }}
  setup: {{ setup | yaml }}
  run: {{ run | yaml }}
